<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not available</title>
<style>
  :root { --bg: #fafaf9; --fg: #111; --muted: #999; --accent: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #78716c; --accent: #fbbf24; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 480px; margin: 5rem auto; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 1.4rem; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Not available</h1>
  <p>{{ message }}</p>
</main>
</body>
</html>
