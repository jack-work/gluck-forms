<!doctype html>
<html lang="en"{% if scheme %} data-scheme="{{ scheme }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submitted · {{ form_title }}</title>
<link rel="stylesheet" href="/static/zanni/fonts.css">
<link rel="stylesheet" href="/static/zanni/gesso.css">
<link rel="stylesheet" href="/static/zanni/fontpack.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--z-ground);
    --fg: var(--z-ink);
    --muted: var(--z-muted);
    --line: var(--z-line);
    --accent: var(--z-accent);
    --danger: var(--z-fail);
    --card: light-dark(#f6ede2, var(--stage-2));
    --input-bg: light-dark(#fbf6f0, #140a0b);
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--fontpack-prose); }
  main { max-width: 480px; margin: 4rem auto; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-family: var(--fontpack-display); font-size: 1.95rem; font-weight: 400; letter-spacing: 0.02em; margin: 0 0 0.5rem; }
  p { color: var(--muted); }
  .id { color: var(--muted); font-size: 0.8rem; margin-top: 2rem; font-variant-numeric: tabular-nums; }
  .check { font-size: 3rem; color: var(--accent); margin-bottom: 1rem; }
</style>
</head>
<body class="gesso">
<main>
  <div class="check">✓</div>
  <h1>Submitted. Thank you.</h1>
  <p>Your response to <strong>{{ form_title }}</strong> was recorded.</p>
  {% if response_id %}<div class="id">confirmation #{{ response_id }}</div>{% endif %}
</main>
</body>
</html>
