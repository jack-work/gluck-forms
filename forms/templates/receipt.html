<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submitted · {{ form_title }}</title>
<style>
  :root {
    --bg: #fafaf9; --fg: #111; --muted: #999; --line: #e5e5e2; --accent: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #78716c; --line: #292524; --accent: #fbbf24; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 480px; margin: 4rem auto; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
  p { color: var(--muted); }
  .id { color: var(--muted); font-size: 0.8rem; margin-top: 2rem; font-variant-numeric: tabular-nums; }
  .check { font-size: 3rem; color: var(--accent); margin-bottom: 1rem; }
</style>
</head>
<body>
<main>
  <div class="check">✓</div>
  <h1>Submitted. Thank you.</h1>
  <p>Your response to <strong>{{ form_title }}</strong> was recorded.</p>
  {% if response_id %}<div class="id">confirmation #{{ response_id }}</div>{% endif %}
</main>
</body>
</html>
